# ==============================================================================
# 設定檔說明 (Configuration Template)
# ==============================================================================
# 1. 請填入下方對應欄位設定。
# 2. 修改完成後，請將此檔案重新命名為: config.ini
# 3. 確保 config.ini 已加入 .gitignore，避免將敏感資訊上傳至版本控制系統。
# =============================================================================

[global]
# logger
log_level = DEBUG
log_path = log
log_name = py.log
log_mode = a


[server]
web_base_host = 0.0.0.0
web_base_port = 5001
web_dns_url = http://your-domain.com


[api]
nekosaur_server_count_prefix = /count
nekosaur_server_upload_prefix = /upload


[image]
# user_upload
user_upload_image_source = your-domain.com
user_upload_origin_path = static/images/user_upload/origin
user_upload_detect_path = static/images/user_upload/detect
user_upload_transform_path = static/images/user_upload/transform

# thecatapi
thecatapi_image_source = api.thecatapi.com
thecatapi_origin_path = static/images/thecatapi/origin
thecatapi_detect_path = static/images/thecatapi/detect
thecatapi_transform_path = static/images/thecatapi/transform

# style image refer
style_ref_paths = static/images/style
default_style_ref_path = static/images/style/head.png


[model]
# === detection ===
# maskrcnn_model
maskrcnn_model = resource/model/detect/maskrcnn_model.pt
# yolo11n
yolo11n = resource/model/detect/yolo11n.pt
# 偵測信心分數
detect_score_threshold = 0.5

# === transform ===
# sd_image_variations
sd_image_variations_model_path = resource/model/transform/sd-image-variations-diffusers

# stable_diffusion
stable_diffusion_model_path = resource/model/transform/stable-diffusion-v1-5
ip_adapter_model_path = resource/model/transform/IP-Adapter
stable_diffusion_prompt = a hybrid creature combining cat and dinosaur, masterpiece, high quality, highly detailed
stable_diffusion_negative_prompt = blurry, low quality, distorted, deformed, noise, artifacts, bad anatomy, text, watermark

# === embedding ===
clip_vit_b_32_model_path = resource/model/embedding/clip-ViT-B-32


[sqlite]
sqlite_path = resource/db/sqlite.db


[lock]
# 基於 SQLite 資料表的分散式鎖裝飾器, 限制流量
# param ttl_seconds:    鎖的存活時間 (TTL)，防止當機死鎖
# param retry_interval: 沒搶到鎖時，隔多少秒重試一次
# param timeout:        最大排隊等待時間，超過則拋出逾時異常
# param max_concurrent: 允許同時處理的最大 session 數
ttl_seconds = 300
retry_interval = 6.0
timeout = 120
max_concurrent = 2
# 記憶體快取 (Cache Layer) - 1 秒內有查詢過直接秒回，完全不用觸發 DB
ttl_cache = 1


[mariadb]
pool_max_connections = 10
pool_min_cached = 2
pool_max_cached = 5

mariadb_host = YOUR_MARIADB_HOST
mariadb_port = 3306
mariadb_user = YOUR_MARIADB_USER
mariadb_password = YOUR_MARIADB_PASSWORD
mariadb_database = nekosaur_db
charset = utf8mb4


[task]
# aps 設定參數
# task thread pool count
thread_pool_count = 2
# sleep time
sleep_time = 10

# 註冊定時任務參數
# thecatapi
thecatapi_url = https://api.thecatapi.com/v1/images/search?mime_types=jpg&limit=1&order=RAND&api_key=
thecatapi_key = YOUR_THECATAPI_KEY
fetch_thecatapi_cron_id = fetch_thecatapi
fetch_thecatapi_count = 2
fetch_thecatapi_cron_hour = 19,23
fetch_thecatapi_cron_minute = 0
fetch_thecatapi_cron_second = 1

# image_daemon_process
image_daemon_process_cron_id = image_daemon_process
image_daemon_process_cron_hour = 19,23
image_daemon_process_cron_minute = 3
image_daemon_process_cron_second = 40
# 查詢某一個區間內的資料, 做資料整理
image_daemon_process_check_before_days = 0
image_daemon_process_check_after_days = 3650
# 一個批次 update 幾筆
image_daemon_process_batch_size = 100


[rabbitmq]
host = YOUR_RABBITMQ_HOST
port = 5672
user = YOUR_RABBITMQ_USER
password = YOUR_RABBITMQ_PASSWORD
vhost = /nekosaur

fetch_thecatapi_queue_name = fetch_thecatapi_queue
fetch_thecatapi_consumer_rest_time = 60

image_daemon_process_queue_name = image_daemon_process_queue
image_daemon_process_consumer_rest_time = 60